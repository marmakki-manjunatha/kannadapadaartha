<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Portal - ಕನ್ನಡ_ಪದಾರ್ಥ</title>
<style>
body{margin:0; background:#fffaf0; font-family: 'Noto Sans Kannada', sans-serif;}
.header{background:black; color:#FFD700; padding:15px 0; text-align:center; font-size:22px; font-weight:bold; border-bottom:3px solid #FFD700;}
.footer{background:black; color:#FFD700; padding:15px 0; text-align:center; font-weight:bold; border-top:3px solid #FFD700; position:fixed; bottom:0; width:100%;}
.main{padding:30px 20px 100px 20px; max-width:650px; margin:auto;}
.card{border:2px solid #FFD700; padding:25px; background:white; border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,0.1);}
h2{margin-top:0; color:#b8860b; text-align:center;}
label{display:block; margin:15px 0 5px; font-weight:bold; color:#333;}
input[type="text"], input[type="password"], textarea{width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; font-family:inherit; font-size:16px; box-sizing:border-box;}
input:focus, textarea:focus{border-color:#b8860b; outline:none;}
button{background:#b8860b; color:white; border:none; padding:12px 20px; font-size:16px; font-weight:bold; border-radius:6px; cursor:pointer; width:100%; margin-top:20px;}
button:hover{background:#996f08;}
.error{color:red; text-align:center; margin-top:10px;}
.status{text-align:center; margin-top:15px; font-weight:bold;}
</style>
</head>
<body>

<div class="header">ಕನ್ನಡ_ಪದಾರ್ಥ - Admin Portal</div>

<div class="main">
  <!-- Auth Section -->
  <div id="auth-section" class="card">
    <h2>ಲಾಗಿನ್ (Login)</h2>
    <label for="admin-pass">ಪಾಸ್‌ವರ್ಡ್ ನಮೂದಿಸಿ:</label>
    <input type="password" id="admin-pass" placeholder="Password">
    <button onclick="checkPassword()">ಲಾಗಿನ್</button>
    <div id="auth-msg" class="error"></div>
  </div>

  <!-- Form Section -->
  <div id="form-section" class="card" style="display:none;">
    <h2>ಹೊಸ ಪುಟ ಸೇರಿಸಿ (Add New Page)</h2>

    <div id="token-field-wrapper" style="display:none;">
      <label>GitHub Token (Only required once on first use):</label>
      <input type="password" id="gh-token-input" placeholder="ghp_...">
    </div>

    <label>ಪುಟದ ಶೀರ್ಷಿಕೆ / ಪದ (Title / Word):</label>
    <input type="text" id="page-title" placeholder="ಉದಾ: Fish_Finish">

    <label>ಸ್ಲಗ್ (Slug):</label>
    <input type="text" id="page-slug" placeholder="ಉದಾ: fish-finish">

    <label>ವಿವರಣೆ ೧ (Short Text 1 - ~500 chars):</label>
    <textarea id="short1" rows="3" placeholder="ಮೊದಲ ವಿವರಣೆ..."></textarea>

    <label>ವಿವರಣೆ ೨ (Short Text 2 - ~500 chars):</label>
    <textarea id="short2" rows="3" placeholder="ಎರಡನೇ ವಿವರಣೆ..."></textarea>

    <label>ಮುಖ್ಯ ವಿವರಣೆ (Main Text Content - 2000+ chars):</label>
    <textarea id="longText" rows="8" placeholder="ದೀರ್ಘ ವಿವರಣೆ..."></textarea>

    <button onclick="submitNewPage()">ಪುಟವನ್ನು ಪ್ರಕಟಿಸಿ (Publish Page)</button>
    <div id="status-msg" class="status"></div>
  </div>
</div>

<div class="footer">ಕನ್ನಡ_ಪದಾರ್ಥ • ನಿರ್ವಾಹಕ ಪುಟ</div>

<script>
const CORRECT_PASS = "manjunaTHAgitHUB";
let attemptsLeft = 3;

function checkPassword() {
  const entered = document.getElementById('admin-pass').value;
  const msg = document.getElementById('auth-msg');

  if (entered === CORRECT_PASS) {
    document.getElementById('auth-section').style.display = 'none';
    document.getElementById('form-section').style.display = 'block';

    // Show token field only if token isn't already saved in browser
    if (!localStorage.getItem('gh_pat')) {
      document.getElementById('token-field-wrapper').style.display = 'block';
    }
  } else {
    attemptsLeft--;
    if (attemptsLeft > 0) {
      msg.textContent = `ತಪ್ಪಾದ ಪಾಸ್‌ವರ್ಡ್. ನಿಮಗೆ ಇನ್ನೂ ${attemptsLeft} ಅವಕಾಶಗಳಿವೆ.`;
    } else {
      document.getElementById('auth-section').innerHTML = '<h3 class="error">sorry- cannot log you in.</h3>';
    }
  }
}

async function submitNewPage() {
  let token = localStorage.getItem('gh_pat');
  const tokenInput = document.getElementById('gh-token-input');
  
  if (!token && tokenInput && tokenInput.value.trim()) {
    token = tokenInput.value.trim();
    localStorage.setItem('gh_pat', token);
  }

  const title = document.getElementById('page-title').value.trim();
  const slug = document.getElementById('page-slug').value.trim();
  const short1 = document.getElementById('short1').value.trim();
  const short2 = document.getElementById('short2').value.trim();
  const longText = document.getElementById('longText').value.trim();
  const status = document.getElementById('status-msg');

  if (!token) {
    status.style.color = "red";
    status.textContent = "ದಯವಿಟ್ಟು GitHub Token ನಮೂದಿಸಿ.";
    return;
  }

  if (!title) {
    status.style.color = "red";
    status.textContent = "ದಯವಿಟ್ಟು Title ನಮೂದಿಸಿ.";
    return;
  }

  status.style.color = "#b8860b";
  status.textContent = "ಉಳಿಸಲಾಗುತ್ತಿದೆ (Saving)...";

  const owner = "marmakki-manjunatha";
  const repo = "kannadapadaartha";
  const path = "data.json";
  const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

  try {
    const getRes = await fetch(apiUrl, {
      headers: {
        'Authorization': `token ${token}`,
        'Accept': 'application/vnd.github.v3+json'
      }
    });

    let currentData = [];
    let sha = null;

    if (getRes.ok) {
      const fileInfo = await getRes.json();
      sha = fileInfo.sha;
      const binaryString = atob(fileInfo.content.replace(/\s/g, ''));
      const bytes = Uint8Array.from(binaryString, c => c.charCodeAt(0));
      const decodedText = new TextDecoder('utf-8').decode(bytes);
      currentData = JSON.parse(decodedText);
    }

    const newPage = {
      id: currentData.length + 1,
      slug: slug || `page-${currentData.length + 1}`,
      title: title,
      short1: short1,
      short2: short2,
      longText: longText
    };
    currentData.push(newPage);

    const jsonString = JSON.stringify(currentData, null, 2);
    const utf8Bytes = new TextEncoder().encode(jsonString);
    let binary = '';
    utf8Bytes.forEach(b => binary += String.fromCharCode(b));
    const base64Content = btoa(binary);

    const putRes = await fetch(apiUrl, {
      method: 'PUT',
      headers: {
        'Authorization': `token ${token}`,
        'Accept': 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        message: `Add new page: ${title}`,
        content: base64Content,
        sha: sha
      })
    });

    if (putRes.ok) {
      status.style.color = "green";
      status.textContent = `ಪುಟ #${newPage.id} ಯಶಸ್ವಿಯಾಗಿ ಸೇರಿಸಲಾಗಿದೆ!`;
      document.getElementById('page-title').value = '';
      document.getElementById('page-slug').value = '';
      document.getElementById('short1').value = '';
      document.getElementById('short2').value = '';
      document.getElementById('longText').value = '';
      if (document.getElementById('token-field-wrapper')) {
        document.getElementById('token-field-wrapper').style.display = 'none';
      }
    } else {
      const errData = await putRes.json();
      status.style.color = "red";
      status.textContent = `Error: ${errData.message}`;
    }
  } catch (err) {
    status.style.color = "red";
    status.textContent = `ದೋಷ: ${err.message}`;
  }
}
</script>

</body>
</html>
