<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ಕನ್ನಡ_ಪದಾರ್ಥ - ನಿರ್ವಾಹಕ</title>
<style>
body{margin:0; background:#fffaf0; font-family: 'Noto Sans Kannada', sans-serif;}
.header{background:black; color:#FFD700; padding:15px 0; text-align:center; font-size:22px; font-weight:bold; border-bottom:3px solid #FFD700;}
.footer{background:black; color:#FFD700; padding:15px 0; text-align:center; font-weight:bold; border-top:3px solid #FFD700; position:fixed; bottom:0; width:100%; z-index:10;}
.top-nav{
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 20px 0;
  max-width: 650px;
  margin: auto;
}
.nav-btn{
  background:#FFD700;
  color:#000;
  text-decoration:none;
  padding:6px 14px;
  border-radius:6px;
  font-weight:bold;
  font-size:14px;
  border:1px solid #b8860b;
  cursor:pointer;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}
.nav-btn:hover{background:#e6c200;}

.main{padding:20px 20px 100px 20px; max-width:650px; margin:auto;}
.card{border:2px solid #FFD700; padding:25px; background:white; border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,0.1);}
h2{margin-top:0; color:#b8860b; text-align:center;}
label{display:block; margin:15px 0 5px; font-weight:bold; color:#333;}
input[type="text"], input[type="password"], textarea{width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; font-family:inherit; font-size:16px; box-sizing:border-box;}
input:focus, textarea:focus{border-color:#b8860b; outline:none;}

.password-wrapper{position:relative; display:flex; align-items:center;}
.password-wrapper input{padding-right:42px;}
.toggle-eye{position:absolute; right:12px; cursor:pointer; user-select:none; font-size:18px; color:#777;}

button.submit-btn{background:#b8860b; color:white; border:none; padding:12px 20px; font-size:16px; font-weight:bold; border-radius:6px; cursor:pointer; width:100%; margin-top:20px;}
button.submit-btn:hover{background:#996f08;}
button.cancel-btn{background:#888; color:white; border:none; padding:10px 20px; font-size:14px; font-weight:bold; border-radius:6px; cursor:pointer; width:100%; margin-top:10px;}

.tiles-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:10px; margin-top:15px; max-height:300px; overflow-y:auto; padding:5px;}
.page-tile{background:#fffaf0; border:1px solid #b8860b; padding:12px 8px; border-radius:8px; text-align:center; cursor:pointer; font-weight:bold; color:#333; transition:0.2s;}
.page-tile:hover{background:#FFD700; color:#000;}

.error{color:red; text-align:center; margin-top:10px;}
.status{text-align:center; margin-top:15px; font-weight:bold;}
</style>
</head>
<body>

<div class="header">ಕನ್ನಡ_ಪದಾರ್ಥ</div>

<!-- Navigation Line -->
<div class="top-nav">
  <button id="btn-edit-toggle" onclick="showEditList()" class="nav-btn" style="display:none;">ಸಂಪಾದಿಸಿ</button>
  <button onclick="goToHome()" class="nav-btn">ಮುಖಪುಟ (Home)</button>
</div>

<div class="main">
  <!-- Auth Section -->
  <div id="auth-section" class="card">
    <h2>ಲಾಗಿನ್</h2>
    <label for="admin-pass">ಪಾಸ್‌ವರ್ಡ್:</label>
    <div class="password-wrapper">
      <input type="password" id="admin-pass">
      <span class="toggle-eye" onclick="toggleVisibility('admin-pass', this)">👁️</span>
    </div>
    <button class="submit-btn" onclick="decryptAndLogin()">ಲಾಗಿನ್</button>
    <div id="auth-msg" class="error"></div>
  </div>

  <!-- Dashboard Container -->
  <div id="dashboard-section" style="display:none;">
    
    <!-- Add New Page View (Default) -->
    <div id="create-view" class="card">
      <h2>ಹೊಸ ಪುಟ ಸೇರಿಸಿ</h2>
      <label>ಪುಟದ ಶೀರ್ಷಿಕೆ:</label>
      <input type="text" id="page-title">

      <label>ವಿವರಣೆ ೧:</label>
      <textarea id="short1" rows="3"></textarea>

      <label>ವಿವರಣೆ ೨:</label>
      <textarea id="short2" rows="3"></textarea>

      <label>ಮುಖ್ಯ ವಿವರಣೆ:</label>
      <textarea id="longText" rows="8"></textarea>

      <button class="submit-btn" onclick="submitNewPage()">ಪುಟವನ್ನು ಪ್ರಕಟಿಸಿ</button>
      <div id="create-status" class="status"></div>
    </div>

    <!-- Edit List Selection View -->
    <div id="edit-list-view" class="card" style="display:none;">
      <h2>ಪುಟ ಸಂಪಾದಿಸಿ</h2>
      <label>ಹುಡುಕಿ (Search by title):</label>
      <input type="text" id="search-box" placeholder="ಶೀರ್ಷಿಕೆ ನಮೂದಿಸಿ..." oninput="filterTiles()">
      
      <div class="tiles-grid" id="tiles-container"></div>
      <button class="cancel-btn" onclick="showAddForm()">ಹೊಸ ಪುಟ ಸೇರಿಸಲು ಹಿಂತಿರುಗಿ</button>
    </div>

    <!-- Edit Form View -->
    <div id="edit-form-view" class="card" style="display:none;">
      <h2>ಪುಟ ನವೀಕರಿಸಿ</h2>
      <input type="hidden" id="edit-page-id">

      <label>ಪುಟದ ಶೀರ್ಷಿಕೆ:</label>
      <input type="text" id="edit-title">

      <label>ವಿವರಣೆ ೧:</label>
      <textarea id="edit-short1" rows="3"></textarea>

      <label>ವಿವರಣೆ ೨:</label>
      <textarea id="edit-short2" rows="3"></textarea>

      <label>ಮುಖ್ಯ ವಿವರಣೆ:</label>
      <textarea id="edit-longText" rows="8"></textarea>

      <button class="submit-btn" onclick="savePageEdit()">ಬದಲಾವಣೆಗಳನ್ನು ಉಳಿಸಿ</button>
      <button class="cancel-btn" onclick="cancelEdit()">ರದ್ದುಮಾಡಿ (Cancel)</button>
      <div id="edit-status" class="status"></div>
    </div>
  </div>

  <!-- Setup Helper -->
  <div id="setup-section" class="card" style="display:none; margin-top:20px; border-color:#999;">
    <h3>Initial One-Time Setup</h3>
    <label>Enter your GitHub Token:</label>
    <input type="password" id="setup-token" placeholder="ghp_...">
    <button class="submit-btn" style="background:#444;" onclick="generateEncryptedPayload()">Generate Encrypted Cipher</button>
    <div id="setup-output" style="margin-top:10px; word-break:break-all; font-family:monospace; font-size:12px;"></div>
  </div>
</div>

<div class="footer">ಕನ್ನಡ_ಪದಾರ್ಥ</div>

<script>
// --- PASTE YOUR ENCRYPTED PAYLOAD HERE ---
const ENCRYPTED_PAYLOAD = "eyJzYWx0IjpbNzksMTYyLDE2MCwyMCwxNzcsNCw2OSwyMzgsNzIsMTMsODksMTU4LDE4NSwxMDMsNywxMzddLCJpdiI6WzEzLDEzLDQ5LDc3LDIyOSwxNDcsNzUsMTcsOTEsNTksMTQwLDIyNl0sImRhdGEiOlsxNDUsMjIsMTUzLDIzLDE2NSwxNzIsMTE2LDE1NCwxNDgsNTYsMjMzLDE0OSw4MSw4LDIxNiwxMzksMjM4LDExNSwxNjcsOTgsNzEsNDUsMTE1LDE3Myw1NSwxMzgsMTI0LDIwNiwyNTUsMTc0LDE5OCwxNzEsODEsMTIxLDc1LDIxOCwxNjksMjEsMTMsMTQ4LDEyNCwxNSwyMzEsMTI0LDExMywxNTAsMTg1LDY4LDEzNCwyMzUsMjQ1LDIyOSw2NywxNzEsMTkxLDIyNl19";

let decryptedToken = null;
let attemptsLeft = 3;
let allPages = [];

const owner = "marmakki-manjunatha";
const repo = "kannadapadaartha";
const path = "data.json";

function goToHome() {
  window.location.href = 'index.html?t=' + Date.now();
}

function toggleVisibility(inputId, iconElement) {
  const input = document.getElementById(inputId);
  if (input.type === 'password') {
    input.type = 'text';
    iconElement.textContent = '🙈';
  } else {
    input.type = 'password';
    iconElement.textContent = '👁️';
  }
}

async function getKey(password, salt) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    "raw",
    enc.encode(password),
    { name: "PBKDF2" },
    false,
    ["deriveKey"]
  );
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
    keyMaterial,
    { name: "AES-GCM", length: 256 },
    false,
    ["encrypt", "decrypt"]
  );
}

window.onload = function() {
  if (!ENCRYPTED_PAYLOAD) {
    document.getElementById('setup-section').style.display = 'block';
  }
};

async function generateEncryptedPayload() {
  const token = document.getElementById('setup-token').value.trim();
  const pass = "manjunaTHAgitHUB";
  if (!token) return alert("Enter token");

  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await getKey(pass, salt);

  const encrypted = await crypto.subtle.encrypt(
    { name: "AES-GCM", iv: iv },
    key,
    new TextEncoder().encode(token)
  );

  const payload = {
    salt: Array.from(salt),
    iv: Array.from(iv),
    data: Array.from(new Uint8Array(encrypted))
  };

  const outputStr = btoa(JSON.stringify(payload));
  document.getElementById('setup-output').innerHTML = 
    `<b>Success!</b> Copy this string and paste it into <code>const ENCRYPTED_PAYLOAD = "${outputStr}";</code> in admin.html:<br><br><textarea rows="3" readonly style="width:100%">${outputStr}</textarea>`;
}

async function decryptAndLogin() {
  const enteredPass = document.getElementById('admin-pass').value.trim();
  const msg = document.getElementById('auth-msg');

  if (!ENCRYPTED_PAYLOAD) {
    msg.textContent = "Please generate ENCRYPTED_PAYLOAD first using the setup tool below.";
    return;
  }

  try {
    const payload = JSON.parse(atob(ENCRYPTED_PAYLOAD));
    const salt = new Uint8Array(payload.salt);
    const iv = new Uint8Array(payload.iv);
    const data = new Uint8Array(payload.data);

    const key = await getKey(enteredPass, salt);
    const decrypted = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: iv },
      key,
      data
    );

    decryptedToken = new TextDecoder().decode(decrypted);
    document.getElementById('auth-section').style.display = 'none';
    document.getElementById('dashboard-section').style.display = 'block';
    document.getElementById('btn-edit-toggle').style.display = 'inline-block';
    loadPages();
  } catch (err) {
    attemptsLeft--;
    if (attemptsLeft > 0) {
      msg.textContent = `ತಪ್ಪಾದ ಪಾಸ್‌ವರ್ಡ್. ನಿಮಗೆ ಇನ್ನೂ ${attemptsLeft} ಅವಕಾಶಗಳಿವೆ.`;
    } else {
      document.getElementById('auth-section').innerHTML = '<h3 class="error">sorry- cannot log you in.</h3>';
    }
  }
}

function showEditList() {
  document.getElementById('create-view').style.display = 'none';
  document.getElementById('edit-form-view').style.display = 'none';
  document.getElementById('edit-list-view').style.display = 'block';
  loadPages();
}

function showAddForm() {
  document.getElementById('edit-list-view').style.display = 'none';
  document.getElementById('edit-form-view').style.display = 'none';
  document.getElementById('create-view').style.display = 'block';
}

async function loadPages() {
  const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}?t=${Date.now()}`;
  try {
    const res = await fetch(apiUrl, {
      headers: {
        'Authorization': `Bearer ${decryptedToken}`,
        'Accept': 'application/vnd.github.v3+json'
      }
    });
    if (res.ok) {
      const fileInfo = await res.json();
      const binaryString = atob(fileInfo.content.replace(/\s/g, ''));
      const bytes = Uint8Array.from(binaryString, c => c.charCodeAt(0));
      allPages = JSON.parse(new TextDecoder('utf-8').decode(bytes));
      renderTiles(allPages);
    }
  } catch (e) {}
}

function renderTiles(pages) {
  const container = document.getElementById('tiles-container');
  container.innerHTML = '';
  if (!pages || pages.length === 0) {
    container.innerHTML = '<p style="text-align:center; width:100%;">ಯಾವುದೇ ಪುಟಗಳಿಲ್ಲ.</p>';
    return;
  }
  pages.forEach(p => {
    const tile = document.createElement('div');
    tile.className = 'page-tile';
    tile.textContent = p.title || `Page ${p.id}`;
    tile.onclick = () => openEditForm(p.id);
    container.appendChild(tile);
  });
}

function filterTiles() {
  const query = document.getElementById('search-box').value.toLowerCase().trim();
  const filtered = allPages.filter(p => (p.title || '').toLowerCase().includes(query));
  renderTiles(filtered);
}

function openEditForm(pageId) {
  const page = allPages.find(p => p.id === pageId);
  if (!page) return;

  document.getElementById('edit-page-id').value = page.id;
  document.getElementById('edit-title').value = page.title || '';
  document.getElementById('edit-short1').value = page.short1 || '';
  document.getElementById('edit-short2').value = page.short2 || '';
  document.getElementById('edit-longText').value = page.longText || '';
  document.getElementById('edit-status').textContent = '';

  document.getElementById('edit-list-view').style.display = 'none';
  document.getElementById('edit-form-view').style.display = 'block';
}

function cancelEdit() {
  document.getElementById('edit-form-view').style.display = 'none';
  document.getElementById('edit-list-view').style.display = 'block';
}

async function submitNewPage() {
  if (!decryptedToken) return location.reload();
  const title = document.getElementById('page-title').value.trim();
  const short1 = document.getElementById('short1').value.trim();
  const short2 = document.getElementById('short2').value.trim();
  const longText = document.getElementById('longText').value.trim();
  const status = document.getElementById('create-status');

  if (!title) {
    status.style.color = "red";
    status.textContent = "ದಯವಿಟ್ಟು ಶೀರ್ಷಿಕೆ ನಮೂದಿಸಿ.";
    return;
  }

  status.style.color = "#b8860b";
  status.textContent = "ಉಳಿಸಲಾಗುತ್ತಿದೆ...";

  const autoSlug = title.toLowerCase().replace(/\s+/g, '-');
  const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}?t=${Date.now()}`;

  try {
    const getRes = await fetch(apiUrl, {
      headers: {
        'Authorization': `Bearer ${decryptedToken}`,
        'Accept': 'application/vnd.github.v3+json'
      }
    });

    let currentData = [];
    let sha = null;
    if (getRes.ok) {
      const fileInfo = await getRes.json();
      sha = fileInfo.sha;
      const binaryString = atob(fileInfo.content.replace(/\s/g, ''));
      const bytes = Uint8Array.from(binaryString, c => c.charCodeAt(0));
      currentData = JSON.parse(new TextDecoder('utf-8').decode(bytes));
    }

    const newPage = {
      id: currentData.length + 1,
      slug: autoSlug,
      title: title,
      short1: short1,
      short2: short2,
      longText: longText
    };
    currentData.push(newPage);

    const jsonString = JSON.stringify(currentData, null, 2);
    const utf8Bytes = new TextEncoder().encode(jsonString);
    let binary = '';
    utf8Bytes.forEach(b => binary += String.fromCharCode(b));
    const base64Content = btoa(binary);

    const putRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
      method: 'PUT',
      headers: {
        'Authorization': `Bearer ${decryptedToken}`,
        'Accept': 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        message: `Add new page: ${title}`,
        content: base64Content,
        sha: sha
      })
    });

    if (putRes.ok) {
      status.style.color = "green";
      status.textContent = `ಪುಟ #${newPage.id} ಯಶಸ್ವಿಯಾಗಿ ಪ್ರಕಟಿಸಲಾಗಿದೆ!`;
      document.getElementById('page-title').value = '';
      document.getElementById('short1').value = '';
      document.getElementById('short2').value = '';
      document.getElementById('longText').value = '';
      allPages = currentData;
    } else {
      const errData = await putRes.json();
      status.style.color = "red";
      status.textContent = `ದೋಷ: ${errData.message}`;
    }
  } catch (err) {
    status.style.color = "red";
    status.textContent = `ದೋಷ: ${err.message}`;
  }
}

async function savePageEdit() {
  if (!decryptedToken) return location.reload();
  const id = parseInt(document.getElementById('edit-page-id').value);
  const title = document.getElementById('edit-title').value.trim();
  const short1 = document.getElementById('edit-short1').value.trim();
  const short2 = document.getElementById('edit-short2').value.trim();
  const longText = document.getElementById('edit-longText').value.trim();
  const status = document.getElementById('edit-status');

  if (!title) {
    status.style.color = "red";
    status.textContent = "ದಯವಿಟ್ಟು ಶೀರ್ಷಿಕೆ ನಮೂದಿಸಿ.";
    return;
  }

  status.style.color = "#b8860b";
  status.textContent = "ನವೀಕರಿಸಲಾಗುತ್ತಿದೆ...";

  const autoSlug = title.toLowerCase().replace(/\s+/g, '-');
  const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}?t=${Date.now()}`;

  try {
    const getRes = await fetch(apiUrl, {
      headers: {
        'Authorization': `Bearer ${decryptedToken}`,
        'Accept': 'application/vnd.github.v3+json'
      }
    });

    if (!getRes.ok) throw new Error("Failed to fetch latest content");

    const fileInfo = await getRes.json();
    const sha = fileInfo.sha;
    const binaryString = atob(fileInfo.content.replace(/\s/g, ''));
    const bytes = Uint8Array.from(binaryString, c => c.charCodeAt(0));
    let currentData = JSON.parse(new TextDecoder('utf-8').decode(bytes));

    const index = currentData.findIndex(p => p.id === id);
    if (index !== -1) {
      currentData[index].title = title;
      currentData[index].slug = autoSlug;
      currentData[index].short1 = short1;
      currentData[index].short2 = short2;
      currentData[index].longText = longText;
    }

    const jsonString = JSON.stringify(currentData, null, 2);
    const utf8Bytes = new TextEncoder().encode(jsonString);
    let binary = '';
    utf8Bytes.forEach(b => binary += String.fromCharCode(b));
    const base64Content = btoa(binary);

    const putRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
      method: 'PUT',
      headers: {
        'Authorization': `Bearer ${decryptedToken}`,
        'Accept': 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        message: `Update page: ${title}`,
        content: base64Content,
        sha: sha
      })
    });

    if (putRes.ok) {
      status.style.color = "green";
      status.textContent = "ಪುಟ ಯಶಸ್ವಿಯಾಗಿ ನವೀಕರಿಸಲಾಗಿದೆ!";
      allPages = currentData;
      setTimeout(() => {
        cancelEdit();
        renderTiles(allPages);
      }, 1000);
    } else {
      const errData = await putRes.json();
      status.style.color = "red";
      status.textContent = `ದೋಷ: ${errData.message}`;
    }
  } catch (err) {
    status.style.color = "red";
    status.textContent = `ದೋಷ: ${err.message}`;
  }
}
</script>

</body>
</html>
