<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ಕನ್ನಡ_ಪದಾರ್ಥ</title>
<style>
body{margin:0; background:#fffaf0; font-family: 'Noto Sans Kannada', sans-serif;}
.header{background:black; color:#FFD700; padding:15px 0; text-align:center; font-size:22px; font-weight:bold; border-bottom:3px solid #FFD700;}
.footer{background:black; color:#FFD700; padding:15px 0; text-align:center; font-weight:bold; border-top:3px solid #FFD700; position:fixed; bottom:0; width:100%;}
.top-nav{
  display: flex;
  justify-content: flex-end;
  padding: 10px 20px 0;
  max-width: 650px;
  margin: auto;
}
.home-btn{
  background:#FFD700;
  color:#000;
  text-decoration:none;
  padding:6px 14px;
  border-radius:6px;
  font-weight:bold;
  font-size:14px;
  border:1px solid #b8860b;
  cursor:pointer;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}
.home-btn:hover{background:#e6c200;}
.main{padding:20px 20px 100px 20px; max-width:650px; margin:auto;}
.card{border:2px solid #FFD700; padding:25px; background:white; border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,0.1);}
h2{margin-top:0; color:#b8860b; text-align:center;}
label{display:block; margin:15px 0 5px; font-weight:bold; color:#333;}
input[type="text"], input[type="password"], textarea{width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; font-family:inherit; font-size:16px; box-sizing:border-box;}
input:focus, textarea:focus{border-color:#b8860b; outline:none;}

/* Password container & eye icon toggle */
.password-wrapper{
  position: relative;
  display: flex;
  align-items: center;
}
.password-wrapper input {
  padding-right: 42px;
}
.toggle-eye{
  position: absolute;
  right: 12px;
  cursor: pointer;
  user-select: none;
  font-size: 18px;
  color: #777;
}
.toggle-eye:hover{
  color: #000;
}

button.submit-btn{background:#b8860b; color:white; border:none; padding:12px 20px; font-size:16px; font-weight:bold; border-radius:6px; cursor:pointer; width:100%; margin-top:20px;}
button.submit-btn:hover{background:#996f08;}
.error{color:red; text-align:center; margin-top:10px;}
.status{text-align:center; margin-top:15px; font-weight:bold;}
</style>
</head>
<body>

<div class="header">ಕನ್ನಡ_ಪದಾರ್ಥ</div>

<!-- Home Navigation Button -->
<div class="top-nav">
  <button onclick="goToHome()" class="home-btn">ಮುಖಪುಟ (Home)</button>
</div>

<div class="main">
  <!-- Auth Section -->
  <div id="auth-section" class="card">
    <h2>ಲಾಗಿನ್</h2>
    <label for="admin-pass">ಪಾಸ್‌ವರ್ಡ್:</label>
    <div class="password-wrapper">
      <input type="password" id="admin-pass">
      <span class="toggle-eye" onclick="toggleVisibility('admin-pass', this)" title="Show/Hide">👁️</span>
    </div>
    <button class="submit-btn" onclick="checkPassword()">ಲಾಗಿನ್</button>
    <div id="auth-msg" class="error"></div>
  </div>

  <!-- Form Section -->
  <div id="form-section" class="card" style="display:none;">
    <h2>ಹೊಸ ಪುಟ ಸೇರಿಸಿ</h2>

    <label>ಟೋಕನ್:</label>
    <div class="password-wrapper">
      <input type="password" id="gh-token-input">
      <span class="toggle-eye" onclick="toggleVisibility('gh-token-input', this)" title="Show/Hide">👁️</span>
    </div>

    <label>ಪುಟದ ಶೀರ್ಷಿಕೆ:</label>
    <input type="text" id="page-title">

    <label>ಸ್ಲಗ್:</label>
    <input type="text" id="page-slug">

    <label>ವಿವರಣೆ ೧:</label>
    <textarea id="short1" rows="3"></textarea>

    <label>ವಿವರಣೆ ೨:</label>
    <textarea id="short2" rows="3"></textarea>

    <label>ಮುಖ್ಯ ವಿವರಣೆ:</label>
    <textarea id="longText" rows="8"></textarea>

    <button class="submit-btn" onclick="submitNewPage()">ಪುಟವನ್ನು ಪ್ರಕಟಿಸಿ</button>
    <div id="status-msg" class="status"></div>
  </div>
</div>

<div class="footer">ಕನ್ನಡ_ಪದಾರ್ಥ</div>

<script>
const PASSWORD_HASH = "c9bf78018e8156aa41738fb6c0850756708dd3ef78ff3bf26bbd9f2e7d704ecb";
let attemptsLeft = 3;

function goToHome() {
  window.location.href = 'index.html?t=' + Date.now();
}

function toggleVisibility(inputId, iconElement) {
  const input = document.getElementById(inputId);
  if (input.type === 'password') {
    input.type = 'text';
    iconElement.textContent = '🙈';
  } else {
    input.type = 'password';
    iconElement.textContent = '👁️';
  }
}

async function sha256(message) {
  const msgBuffer = new TextEncoder().encode(message);
  const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

async function checkPassword() {
  const entered = document.getElementById('admin-pass').value;
  const msg = document.getElementById('auth-msg');
  const enteredHash = await sha256(entered);

  if (enteredHash === PASSWORD_HASH) {
    document.getElementById('auth-section').style.display = 'none';
    document.getElementById('form-section').style.display = 'block';

    const savedToken = localStorage.getItem('gh_pat');
    if (savedToken) {
      document.getElementById('gh-token-input').value = savedToken;
    }
  } else {
    attemptsLeft--;
    if (attemptsLeft > 0) {
      msg.textContent = `ತಪ್ಪಾದ ಪಾಸ್‌ವರ್ಡ್. ನಿಮಗೆ ಇನ್ನೂ ${attemptsLeft} ಅವಕಾಶಗಳಿವೆ.`;
    } else {
      document.getElementById('auth-section').innerHTML = '<h3 class="error">sorry- cannot log you in.</h3>';
    }
  }
}

async function submitNewPage() {
  const tokenInput = document.getElementById('gh-token-input');
  const token = tokenInput.value.trim();
  const title = document.getElementById('page-title').value.trim();
  const slug = document.getElementById('page-slug').value.trim();
  const short1 = document.getElementById('short1').value.trim();
  const short2 = document.getElementById('short2').value.trim();
  const longText = document.getElementById('longText').value.trim();
  const status = document.getElementById('status-msg');

  if (!token) {
    status.style.color = "red";
    status.textContent = "ದಯವಿಟ್ಟು ಟೋಕನ್ ನಮೂದಿಸಿ.";
    return;
  }

  if (!title) {
    status.style.color = "red";
    status.textContent = "ದಯವಿಟ್ಟು ಶೀರ್ಷಿಕೆ ನಮೂದಿಸಿ.";
    return;
  }

  localStorage.setItem('gh_pat', token);
  status.style.color = "#b8860b";
  status.textContent = "ಉಳಿಸಲಾಗುತ್ತಿದೆ...";

  const owner = "marmakki-manjunatha";
  const repo = "kannadapadaartha";
  const path = "data.json";
  const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

  try {
    const getRes = await fetch(apiUrl, {
      headers: {
        'Authorization': `token ${token}`,
        'Accept': 'application/vnd.github.v3+json'
      }
    });

    if (getRes.status === 401 || getRes.status === 403) {
      localStorage.removeItem('gh_pat');
      status.style.color = "red";
      status.textContent = "ದೋಷ: ಟೋಕನ್ ಅನುಮತಿ ಸರಿಯಾಗಿಲ್ಲ. ಹೊಸ repo-permission ಟೋಕನ್ ನಮೂದಿಸಿ.";
      return;
    }

    let currentData = [];
    let sha = null;

    if (getRes.ok) {
      const fileInfo = await getRes.json();
      sha = fileInfo.sha;
      const binaryString = atob(fileInfo.content.replace(/\s/g, ''));
      const bytes = Uint8Array.from(binaryString, c => c.charCodeAt(0));
      const decodedText = new TextDecoder('utf-8').decode(bytes);
      currentData = JSON.parse(decodedText);
    }

    const newPage = {
      id: currentData.length + 1,
      slug: slug || `page-${currentData.length + 1}`,
      title: title,
      short1: short1,
      short2: short2,
      longText: longText
    };
    currentData.push(newPage);

    const jsonString = JSON.stringify(currentData, null, 2);
    const utf8Bytes = new TextEncoder().encode(jsonString);
    let binary = '';
    utf8Bytes.forEach(b => binary += String.fromCharCode(b));
    const base64Content = btoa(binary);

    const putRes = await fetch(apiUrl, {
      method: 'PUT',
      headers: {
        'Authorization': `token ${token}`,
        'Accept': 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        message: `Add new page: ${title}`,
        content: base64Content,
        sha: sha
      })
    });

    if (putRes.ok) {
      status.style.color = "green";
      status.textContent = `ಪುಟ #${newPage.id} ಯಶಸ್ವಿಯಾಗಿ ಪ್ರಕಟಿಸಲಾಗಿದೆ!`;
      document.getElementById('page-title').value = '';
      document.getElementById('page-slug').value = '';
      document.getElementById('short1').value = '';
      document.getElementById('short2').value = '';
      document.getElementById('longText').value = '';
    } else {
      const errData = await putRes.json();
      status.style.color = "red";
      status.textContent = `ದೋಷ: ${errData.message}`;
    }
  } catch (err) {
    status.style.color = "red";
    status.textContent = `ದೋಷ: ${err.message}`;
  }
}
</script>

</body>
</html>
