<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ಕನ್ನಡ_ಪದಾರ್ಥ - ಮಾರ್ಮಕ್ಕಿ ಮಞಾತ</title>
<style>
body{margin:0; background:#fffaf0; font-family: 'Noto Sans Kannada', sans-serif;}
.header{background:black; color:#FFD700; padding:15px 0; overflow:hidden; white-space:nowrap; border-bottom:3px solid #FFD700;}
.footer{background:black; color:#FFD700; padding:15px 0; overflow:hidden; white-space:nowrap; border-top:3px solid #FFD700; position:fixed; bottom:0; width:100%; z-index:10;}
.scroll{animation: scroll 20s linear infinite; display:inline-block; padding-left:100%; font-size:20px; font-weight:bold;}
.scroll2{animation: scroll2 20s linear infinite; display:inline-block; padding-left:100%; font-size:20px; font-weight:bold;}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
@keyframes scroll2{0%{transform:translateX(-100%)}100%{transform:translateX(0)}}

.top-nav{
  display: flex;
  justify-content: flex-end;
  padding: 10px 20px 0;
  max-width: 800px;
  margin: auto;
}
.admin-btn{
  background:#FFD700;
  color:#000;
  text-decoration:none;
  padding:6px 14px;
  border-radius:6px;
  font-weight:bold;
  font-size:14px;
  border:1px solid #b8860b;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}
.admin-btn:hover{background:#e6c200;}

.main{padding:10px 20px 140px 20px; max-width:800px; margin:auto;}
h1{text-align:center; font-size:42px; color:#222; margin-bottom:10px;}
.subtitle{text-align:center; color:#555; margin-bottom:30px;}
.word{border:2px solid #FFD700; padding:20px; background:white; margin:20px 0; border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,0.1);}
.word h2{margin:0 0 15px 0; color:#b8860b; font-size:32px;}
.word p{font-size:18px; line-height:1.7; color:#333; margin:12px 0; white-space:pre-wrap;}

/* Pinned Navigation Bar above footer */
.pagination-container{
  position:fixed; 
  bottom:55px; 
  left:0; 
  width:100%; 
  background:rgba(255, 250, 240, 0.98); 
  padding:8px 0; 
  z-index:9; 
  border-top:1px solid #e0d0b0;
}
.pagination{
  display:flex; 
  align-items:center; 
  justify-content:center; 
  gap:8px; 
  max-width:850px; 
  margin:auto; 
  padding:0 10px;
  overflow-x:auto;
}
.page-btn{
  padding:6px 14px; 
  text-decoration:none; 
  background:white; 
  color:#b8860b; 
  border:2px solid #FFD700; 
  border-radius:6px; 
  font-weight:bold; 
  cursor:pointer; 
  font-size:14px;
  white-space:nowrap;
}
.page-btn.active{
  background:#FFD700; 
  color:black;
}
.arrow-btn{
  padding:6px 12px;
  text-decoration:none;
  background:#b8860b;
  color:white;
  border-radius:6px;
  font-weight:bold;
  font-size:14px;
  cursor:pointer;
  border:none;
}
.arrow-btn.disabled{
  background:#ccc;
  cursor:not-allowed;
  pointer-events:none;
}
</style>
</head>
<body>

<div class="header">
  <div class="scroll">↔ ಮಾರ್ಮಕ್ಕಿ ಮಞಾತನ ಕನ್ನಡಾಂಗ್ಲ ಪದಕೋಶ ↔ ಮಾರ್ಮಕ್ಕಿ ಮಞಾತನ ಕನ್ನಡಾಂಗ್ಲ ಪದಕೋಶ ↔ ಕನ್ನಡ_ಪದಾರ್ಥ ↔</div>
</div>

<div class="top-nav">
  <a href="admin.html" class="admin-btn">ನಿರ್ವಾಹಕ (Admin)</a>
</div>

<div class="main">
  <h1>ಕನ್ನಡ_ಪದಾರ್ಥ</h1>
  <p class="subtitle">ಮಾರ್ಮಕ್ಕಿ ಮಞಾತನ ಕನ್ನಡಾಂಗ್ಲ ಪದಕೋಶ • ಭಾಷಾ ಸಂಶೋಧನೆ</p>

  <div id="content-area"></div>
</div>

<!-- Bottom Navigation Bar with Arrows & Page Titles -->
<div class="pagination-container">
  <div class="pagination" id="pagination"></div>
</div>

<div class="footer">
  <div class="scroll2">⇒ ಇದು ಕನ್ನಡದ ಕಸ್ತೂರಿ ಭಾಷಾ ಪರಿಮಳ ⇒ ಇದು ಕನ್ನಡದ ಕಸ್ತೂರಿ ಭಾಷಾ ಪರಿಮಳ ⇒ ಕನ್ನಡ_ಪದಾರ್ಥ ⇒</div>
</div>

<script>
const apiUrl = 'https://api.github.com/repos/marmakki-manjunatha/kannadapadaartha/contents/data.json?t=' + Date.now();

fetch(apiUrl, { headers: { 'Accept': 'application/vnd.github.v3+json' } })
  .then(res => res.json())
  .then(fileInfo => {
    const binaryString = atob(fileInfo.content.replace(/\s/g, ''));
    const bytes = Uint8Array.from(binaryString, c => c.charCodeAt(0));
    const decodedText = new TextDecoder('utf-8').decode(bytes);
    const pages = JSON.parse(decodedText);

    if (!Array.isArray(pages) || pages.length === 0) {
      document.getElementById('content-area').innerHTML = '<p style="text-align:center;">ಯಾವುದೇ ಪುಟಗಳು ಲಭ್ಯವಿಲ್ಲ.</p>';
      return;
    }

    const params = new URLSearchParams(window.location.search);
    let currentPage = parseInt(params.get('page')) || 1;
    if (currentPage < 1 || currentPage > pages.length) currentPage = 1;

    // Display current page content
    const data = pages[currentPage - 1];
    const contentArea = document.getElementById('content-area');
    
    if (data) {
      contentArea.innerHTML = `
        <div class="word">
          <h2>${data.title || ''}</h2>
          ${data.short1 ? `<p>${data.short1}</p>` : ''}
          ${data.short2 ? `<p>${data.short2}</p>` : ''}
          ${data.longText ? `<p>${data.longText}</p>` : ''}
        </div>
      `;
    }

    // Build pagination controls
    const pagination = document.getElementById('pagination');
    pagination.innerHTML = '';

    // Previous Arrow Button (←)
    const prevBtn = document.createElement('a');
    prevBtn.innerHTML = '&larr; ಹಿಂದಿನದು';
    prevBtn.className = `arrow-btn ${currentPage === 1 ? 'disabled' : ''}`;
    prevBtn.href = `?page=${currentPage - 1}`;
    pagination.appendChild(prevBtn);

    // Title buttons for each page
    pages.forEach((pageItem, idx) => {
      const pageNum = idx + 1;
      const a = document.createElement('a');
      a.href = `?page=${pageNum}`;
      a.className = `page-btn ${pageNum === currentPage ? 'active' : ''}`;
      a.textContent = pageItem.title || `Page ${pageNum}`;
      pagination.appendChild(a);
    });

    // Next Arrow Button (→)
    const nextBtn = document.createElement('a');
    nextBtn.innerHTML = 'ಮುಂದಿನದು &rarr;';
    nextBtn.className = `arrow-btn ${currentPage === pages.length ? 'disabled' : ''}`;
    nextBtn.href = `?page=${currentPage + 1}`;
    pagination.appendChild(nextBtn);
  })
  .catch(err => {
    fetch('data.json?t=' + Date.now(), { cache: 'no-store' })
      .then(r => r.json())
      .then(() => location.reload())
      .catch(() => {
        document.getElementById('content-area').innerHTML = '<p style="text-align:center;">ಲೋಡ್ ಮಾಡಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ.</p>';
      });
  });
</script>

</body>
</html>
