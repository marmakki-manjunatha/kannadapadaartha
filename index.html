<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ಕನ್ನಡ_ಪದಾರ್ಥ - ಮಾರ್ಮಕ್ಕಿ ಮಞಾತ</title>
<style>
body{margin:0; background:#fffaf0; font-family: 'Noto Sans Kannada', sans-serif;}
.header{background:black; color:#FFD700; padding:15px 0; overflow:hidden; white-space:nowrap; border-bottom:3px solid #FFD700;}
.footer{background:black; color:#FFD700; padding:15px 0; overflow:hidden; white-space:nowrap; border-top:3px solid #FFD700; position:fixed; bottom:0; width:100%;}
.scroll{animation: scroll 20s linear infinite; display:inline-block; padding-left:100%; font-size:20px; font-weight:bold;}
.scroll2{animation: scroll2 20s linear infinite; display:inline-block; padding-left:100%; font-size:20px; font-weight:bold;}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
@keyframes scroll2{0%{transform:translateX(-100%)}100%{transform:translateX(0)}}
.main{padding:30px 20px 140px 20px; max-width:800px; margin:auto;}
h1{text-align:center; font-size:42px; color:#222; margin-bottom:10px;}
.subtitle{text-align:center; color:#555; margin-bottom:30px;}
.word{border:2px solid #FFD700; padding:20px; background:white; margin:20px 0; border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,0.1);}
.word h2{margin:0 0 15px 0; color:#b8860b; font-size:32px;}
.word p{font-size:18px; line-height:1.7; color:#333; margin:12px 0; white-space:pre-wrap;}
.pagination{display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:30px; padding:15px 0;}
.page-btn{padding:8px 14px; text-decoration:none; background:white; color:#b8860b; border:2px solid #FFD700; border-radius:6px; font-weight:bold;}
.page-btn.active{background:#FFD700; color:black;}
</style>
</head>
<body>

<div class="header"><div class="scroll">↔ ಮಾರ್ಮಕ್ಕಿ ಮಞಾತನ ಕನ್ನಡಾಂಗ್ಲ ಪದಕೋಶ ↔ ಮಾರ್ಮಕ್ಕಿ ಮಞಾತನ ಕನ್ನಡಾಂಗ್ಲ ಪದಕೋಶ ↔ ಕನ್ನಡ_ಪದಾರ್ಥ ↔</div></div>

<div class="main">
  <h1>ಕನ್ನಡ_ಪದಾರ್ಥ</h1>
  <p class="subtitle">ಮಾರ್ಮಕ್ಕಿ ಮಞಾತನ ಕನ್ನಡಾಂಗ್ಲ ಪದಕೋಶ • ಭಾಷಾ ಸಂಶೋಧನೆ</p>

  <div id="content-area"></div>

  <!-- Page Navigation -->
  <div class="pagination" id="pagination"></div>
</div>

<div class="footer"><div class="scroll2">⇒ ಇದು ಕನ್ನಡದ ಕಸ್ತೂರಿ ಭಾಷಾ ಪರಿಮಳ ⇒ ಇದು ಕನ್ನಡದ ಕಸ್ತೂರಿ ಭಾಷಾ ಪರಿಮಳ ⇒ ಕನ್ನಡ_ಪದಾರ್ಥ ⇒</div></div>

<script>
fetch('data.json?v=' + Date.now())
  .then(res => res.json())
  .then(pages => {
    const params = new URLSearchParams(window.location.search);
    let currentPage = parseInt(params.get('page')) || 1;
    if (currentPage < 1 || currentPage > pages.length) currentPage = 1;

    const data = pages[currentPage - 1];
    const contentArea = document.getElementById('content-area');
    
    if (data) {
      contentArea.innerHTML = `
        <div class="word">
          <h2>${data.title || ''}</h2>
          ${data.short1 ? `<p>${data.short1}</p>` : ''}
          ${data.short2 ? `<p>${data.short2}</p>` : ''}
          ${data.longText ? `<p>${data.longText}</p>` : ''}
        </div>
      `;
    }

    const pagination = document.getElementById('pagination');
    pages.forEach((_, idx) => {
      const pageNum = idx + 1;
      const a = document.createElement('a');
      a.href = `?page=${pageNum}`;
      a.className = `page-btn ${pageNum === currentPage ? 'active' : ''}`;
      a.textContent = `Page ${pageNum}`;
      pagination.appendChild(a);
    });
  })
  .catch(err => {
    document.getElementById('content-area').innerHTML = '<p style="text-align:center;">ಲೋಡ್ ಮಾಡಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ.</p>';
  });
</script>

</body>
</html>
