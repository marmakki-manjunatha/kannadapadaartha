<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ಕನ್ನಡ_ಪದಾರ್ಥ - ಮಾರ್ಮಕ್ಕಿ ಮಞಾತ</title>
<style>
body{margin:0; background:#fffaf0; font-family: 'Noto Sans Kannada', sans-serif;}
.header{background:black; color:#FFD700; padding:15px 0; overflow:hidden; white-space:nowrap; border-bottom:3px solid #FFD700;}
.footer{background:black; color:#FFD700; padding:15px 0; overflow:hidden; white-space:nowrap; border-top:3px solid #FFD700; position:fixed; bottom:0; width:100%; z-index:10;}
.scroll{animation: scroll 20s linear infinite; display:inline-block; padding-left:100%; font-size:20px; font-weight:bold;}
.scroll2{animation: scroll2 20s linear infinite; display:inline-block; padding-left:100%; font-size:20px; font-weight:bold;}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
@keyframes scroll2{0%{transform:translateX(-100%)}100%{transform:translateX(0)}}

.top-nav{
  display: flex;
  justify-content: flex-end;
  padding: 10px 20px 0;
  max-width: 900px;
  margin: auto;
}
.admin-btn{
  background:#FFD700;
  color:#000;
  text-decoration:none;
  padding:6px 14px;
  border-radius:6px;
  font-weight:bold;
  font-size:14px;
  border:1px solid #b8860b;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}
.admin-btn:hover{background:#e6c200;}

.main{padding:10px 20px 160px 20px; max-width:900px; margin:auto;}
h1{text-align:center; font-size:40px; color:#222; margin-bottom:6px;}
.subtitle{text-align:center; color:#555; margin-bottom:25px;}

.word-card{
  background:white;
  border:2px solid #FFD700;
  border-radius:12px;
  padding:24px 20px;
  box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

.word-card h2{
  text-align:center;
  color:#b8860b;
  font-size:32px;
  margin:0 0 25px 0;
  border-bottom:2px solid #fff2b2;
  padding-bottom:10px;
}

.entry-row{
  display: flex;
  align-items: flex-start;
  margin-bottom: 18px;
  gap: 15px;
}

.entry-label{
  width: 170px;
  min-width: 170px;
  padding: 10px 8px;
  border: 1.5px solid #222;
  border-radius: 6px;
  font-weight: bold;
  font-size: 16px;
  text-align: center;
  color: #111;
  background: #fffdf5;
  box-sizing: border-box;
  line-height: 1.3;
}

.entry-content{
  flex: 1;
  border: 1.5px solid #222;
  border-radius: 6px;
  padding: 12px 16px;
  font-size: 17px;
  line-height: 1.6;
  color: #222;
  background: #fff;
  white-space: pre-wrap;
  box-sizing: border-box;
}

/* Bottom Navigation */
.pagination-container{
  position:fixed; 
  bottom:55px; 
  left:0; 
  width:100%; 
  background:rgba(255, 250, 240, 0.98); 
  padding:10px 0; 
  z-index:9; 
  border-top:1px solid #e0d0b0;
}
.pagination{
  display:flex; 
  align-items:center; 
  justify-content:center; 
  flex-wrap:nowrap; 
  gap:8px; 
  width:100%; 
  max-width:1200px; 
  margin:auto; 
  padding:0 15px;
  box-sizing:border-box;
}
.page-btn{
  padding:7px 12px; 
  text-decoration:none; 
  background:white; 
  color:#b8860b; 
  border:2px solid #FFD700; 
  border-radius:6px; 
  font-weight:bold; 
  cursor:pointer; 
  font-size:14px;
  white-space:nowrap;
  text-align:center;
}
.page-btn.active{
  background:#FFD700; 
  color:black;
}
.arrow-btn{
  padding:7px 12px;
  text-decoration:none;
  background:#b8860b;
  color:white;
  border-radius:6px;
  font-weight:bold;
  font-size:14px;
  cursor:pointer;
  border:none;
  white-space:nowrap;
  flex-shrink:0;
}
.arrow-btn.disabled{
  background:#ccc;
  cursor:not-allowed;
  pointer-events:none;
}

@media(max-width: 768px){
  h1{font-size:30px;}
  .word-card h2{font-size:24px;}
  
  .entry-row{
    flex-direction: column;
    gap: 6px;
    margin-bottom: 15px;
  }
  .entry-label{
    width: 100%;
    min-width: 100%;
    text-align: left;
    padding: 6px 10px;
    font-size: 15px;
  }
  .entry-content{
    width: 100%;
    font-size: 15px;
    padding: 10px 12px;
  }

  .pagination{
    gap:6px; 
    padding:0 8px;
  }
  .page-btn{
    flex:1;
    max-width:130px;
    font-size:13px;
    padding:6px 6px;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .arrow-btn{
    font-size:14px;
    padding:6px 10px;
  }
}
</style>
</head>
<body>

<div class="header">
  <div class="scroll">↔ ಮಾರ್ಮಕ್ಕಿ ಮಞಾತನ ಕನ್ನಡಾಂಗ್ಲ ಪದಕೋಶ ↔ ಮಾರ್ಮಕ್ಕಿ ಮಞಾತನ ಕನ್ನಡಾಂಗ್ಲ ಪದಕೋಶ ↔ ಕನ್ನಡ_ಪದಾರ್ಥ ↔</div>
</div>

<div class="top-nav">
  <a href="admin.html" class="admin-btn">ನಿರ್ವಾಹಕ (Admin)</a>
</div>

<div class="main">
  <h1>ಕನ್ನಡ_ಪದಾರ್ಥ</h1>
  <p class="subtitle">ಮಾರ್ಮಕ್ಕಿ ಮಞಾತನ ಕನ್ನಡಾಂಗ್ಲ ಪದಕೋಶ • ಭಾಷಾ ಸಂಶೋಧನೆ</p>

  <div id="content-area"></div>
</div>

<div class="pagination-container">
  <div class="pagination" id="pagination"></div>
</div>

<div class="footer">
  <div class="scroll2">⇒ ಇದು ಕನ್ನಡದ ಕಸ್ತೂರಿ ಭಾಷಾ ಪರಿಮಳ ⇒ ಇದು ಕನ್ನಡದ ಕಸ್ತೂರಿ ಭಾಷಾ ಪರಿಮಳ ⇒ ಕನ್ನಡ_ಪದಾರ್ಥ ⇒</div>
</div>

<script>
const apiUrl = 'https://api.github.com/repos/marmakki-manjunatha/kannadapadaartha/contents/data.json?t=' + Date.now();

fetch(apiUrl, { headers: { 'Accept': 'application/vnd.github.v3+json' } })
  .then(res => res.json())
  .then(fileInfo => {
    const binaryString = atob(fileInfo.content.replace(/\s/g, ''));
    const bytes = Uint8Array.from(binaryString, c => c.charCodeAt(0));
    const decodedText = new TextDecoder('utf-8').decode(bytes);
    const pages = JSON.parse(decodedText);

    if (!Array.isArray(pages) || pages.length === 0) {
      document.getElementById('content-area').innerHTML = '<p style="text-align:center;">ಯಾವುದೇ ಪುಟಗಳು ಲಭ್ಯವಿಲ್ಲ.</p>';
      return;
    }

    const params = new URLSearchParams(window.location.search);
    let currentPage = parseInt(params.get('page')) || 1;
    if (currentPage < 1 || currentPage > pages.length) currentPage = 1;

    const data = pages[currentPage - 1];
    const contentArea = document.getElementById('content-area');
    
    if (data) {
      const s1 = data.short1 && data.short1.trim().length > 0 ? data.short1 : null;
      const s2 = data.short2 && data.short2.trim().length > 0 ? data.short2 : null;
      const longTxt = data.longText && data.longText.trim().length > 0 ? data.longText : null;

      let html = `<div class="word-card">`;
      html += `<h2>${data.title || ''}</h2>`;

      if (s1) {
        html += `
          <div class="entry-row">
            <div class="entry-label">ಆಚಾರ</div>
            <div class="entry-content">${s1}</div>
          </div>
        `;
      }

      if (s2) {
        html += `
          <div class="entry-row">
            <div class="entry-label">ವಿಚಾರ</div>
            <div class="entry-content">${s2}</div>
          </div>
        `;
      }

      if (longTxt) {
        html += `
          <div class="entry-row">
            <div class="entry-label">WORKSHOP<br><small style="font-size:12px; font-weight:normal;">De-code</small></div>
            <div class="entry-content">${longTxt}</div>
          </div>
        `;
      }

      html += `</div>`;
      contentArea.innerHTML = html;
    }

    const pagination = document.getElementById('pagination');
    pagination.innerHTML = '';
    
    const isMobile = window.innerWidth <= 768;

    const prevBtn = document.createElement('a');
    prevBtn.innerHTML = isMobile ? '&laquo;' : '&larr; ಹಿಂದಿನದು';
    prevBtn.className = `arrow-btn ${currentPage === 1 ? 'disabled' : ''}`;
    prevBtn.href = `?page=${currentPage - 1}`;
    pagination.appendChild(prevBtn);

    let visibleIndices = [];
    const maxButtons = isMobile ? 2 : 8;

    if (pages.length <= maxButtons) {
      visibleIndices = pages.map((_, i) => i);
    } else {
      const half = Math.floor(maxButtons / 2);
      let start = (currentPage - 1) - half;
      let end = start + maxButtons;

      if (start < 0) {
        start = 0;
        end = maxButtons;
      }
      if (end > pages.length) {
        end = pages.length;
        start = end - maxButtons;
      }
      for (let i = start; i < end; i++) {
        visibleIndices.push(i);
      }
    }

    visibleIndices.forEach(idx => {
      const pageItem = pages[idx];
      const pageNum = idx + 1;
      const a = document.createElement('a');
      a.href = `?page=${pageNum}`;
      a.className = `page-btn ${pageNum === currentPage ? 'active' : ''}`;
      a.textContent = pageItem.title || '';
      pagination.appendChild(a);
    });

    const nextBtn = document.createElement('a');
    nextBtn.innerHTML = isMobile ? '&raquo;' : 'ಮುಂದಿನದು &rarr;';
    nextBtn.className = `arrow-btn ${currentPage === pages.length ? 'disabled' : ''}`;
    nextBtn.href = `?page=${currentPage + 1}`;
    pagination.appendChild(nextBtn);
  })
  .catch(err => {
    fetch('data.json?t=' + Date.now(), { cache: 'no-store' })
      .then(r => r.json())
      .then(() => location.reload())
      .catch(() => {
        document.getElementById('content-area').innerHTML = '<p style="text-align:center;">ಲೋಡ್ ಮಾಡಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ.</p>';
      });
  });
</script>

</body>
</html>
